name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate (FND-11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kalloud
          POSTGRES_USER: kalloud
          POSTGRES_PASSWORD: kalloud_dev_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U kalloud -d kalloud"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # DATABASE_URL_TEST intentionally points at the same ephemeral CI
      # database as DATABASE_URL: unlike local dev there is no persistent
      # developer data to protect from the integration suite's truncation,
      # and a second database would need extra provisioning this single
      # Postgres service does not support out of the box. Values are fixed
      # literals defined in this file, not derived from any event input.
      - name: Configure environment
        run: |
          {
            echo "DATABASE_URL=postgresql://kalloud:kalloud_dev_password@localhost:5433/kalloud"
            echo "DATABASE_URL_TEST=postgresql://kalloud:kalloud_dev_password@localhost:5433/kalloud"
          } >> "$GITHUB_ENV"

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Reset and seed database for E2E
        run: pnpm db:reset && pnpm db:migrate && pnpm db:seed

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Security audit (fails on high/critical advisories)
        run: pnpm audit --audit-level=high
