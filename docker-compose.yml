services:
  postgres:
    image: postgres:16-alpine
    container_name: kalloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kalloud
      POSTGRES_USER: kalloud
      POSTGRES_PASSWORD: kalloud_dev_password
    ports:
      - "5433:5432"
    volumes:
      - kalloud_postgres_data:/var/lib/postgresql/data
      # Only a one-off "create the test database" script lives here now
      # (FND-05): the application schema itself is owned exclusively by
      # migrations/ and applied by scripts/migrate.mjs, never by Postgres'
      # own docker-entrypoint-initdb.d mechanism.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalloud -d kalloud"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kalloud_postgres_data:
