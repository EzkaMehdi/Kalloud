# OPS-05: the production runtime, as a file rather than as steps someone
# remembers. `docker compose -f docker-compose.prod.yml up -d` is the whole
# deployment, and it is the same command on every host — which is what
# "reproductible" has to mean.
#
# TLS is deliberately absent: DEC-02 terminates HTTPS at the reverse proxy
# in front of this stack (the application sets `secure` cookies and HSTS on
# its own, lib/auth/cookies.ts and proxy.ts). Putting certificates here would
# duplicate that responsibility in two places, which is how one of them ends
# up expired.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published on the host: the application reaches it over the compose
    # network, and nothing else should reach it at all.
    expose:
      - "5432"

  # Migrations run as their own one-shot service rather than inside the
  # application's entrypoint. Two reasons: several application replicas would
  # otherwise race to migrate the same database, and a failed migration must
  # stop the deployment instead of leaving a container restart-looping while
  # the previous release is already gone.
  migrate:
    build: .
    command: ["node", "scripts/migrate.mjs", "up"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      OPS_METRICS_TOKEN: ${OPS_METRICS_TOKEN:?OPS_METRICS_TOKEN is required}
    # Refuses to start on a development configuration (OPS-05's "aucune
    # variable de développement"), then serves.
    command: ["sh", "-c", "node scripts/check-env.mjs && node server.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # Readiness, not liveness: it also asserts the schema matches this
      # image, so a rolled-back release is reported unhealthy instead of
      # quietly taking traffic on a newer schema (lib/schema-version.ts).
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
